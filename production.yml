version: "3.9"
# test remove container remove rabbitmq
services:
  rabbitmq_mail:
    image: rabbitmq:3.7-management
    container_name: rabbitmq_mail
    restart: always
    env_file:
      - ./.envs/.production/.live
    expose:
      - "5674"
      - "15674"
    networks:
      - reverseproxy-nw
  api: &api # container_name: api
    build:
      context: .
      dockerfile: ./docker/production/django/Dockerfile
    command: /start
    container_name: api_notif
    restart: always
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    expose:
      - "9081"
    networks:
      - reverseproxy-nw
    env_file:
      - ./.envs/.production/.postgres
      - ./.envs/.production/.django

  celery_worker:
    <<: *api
    image: worker
    command: celery -A notification worker -l DEBUG
    networks:
      - reverseproxy-nw
    depends_on:
      - api
      - rabbitmq_mail

  celery_beat:
    <<: *api
    image: beat
    command: celery -A notification beat -l INFO
    networks:
      - reverseproxy-nw
    depends_on:
      - api
      - rabbitmq_mail

  nginx:
    restart: always
    depends_on:
      - api
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    build:
      context: ./docker/production/nginx
      dockerfile: Dockerfile
    ports:
      - "8083:80"
    networks:
      - reverseproxy-nw

networks:
  reverseproxy-nw:
    external: true

volumes:
  static_volume:
  media_volume:
