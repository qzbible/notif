version: '3'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    container_name: web
    restart: always
    volumes:
      - .:/app
    ports:
      - 8000:8000
    depends_on:
      - postgres_celery
      - rabbitmq_m
      - celery-beat
      - celery-worker

  postgres_celery:
    image: postgres:latest
    container_name: postgres_celery
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ziyouma
      POSTGRES_DB: klivar-db
      POSTGRES_PORT: 5432
      PGDATA: /data/postgres
    ports:
      - 5432:5432
    restart: always

