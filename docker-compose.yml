version: '3.8'

services:
  rabbitmq_mail:
    image: rabbitmq:3.7-management
    container_name: rabbitmq_mail
    restart: always
    env_file:
      - ./live.env
    ports:
      - "21001:5674"
      - "21002:15674"
    networks:
      - application_celery

  application_celery:
    container_name: application_celery
    build:
      context: .
    command: /start

    restart: always
    volumes:
      - .:/code
    expose:
      - 9081
    ports:
      - 8081:9081
    networks:
      - application_celery
    env_file:
      - ./db.env
    depends_on:
      - postgres_celery
         

  postgres_celery:
    container_name: postgres_celery
    image: postgres:14.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ziyouma}
      POSTGRES_DB: ${POSTGRES_DB:-celery}
      PGDATA: /data/postgres
    volumes:
       - postgres_data:/data/celery
    ports:
      - "5432:5432"
    networks:
      - application_celery
    restart: always
networks:
  application_celery:
    driver: bridge

volumes:
  application_celery:
  postgres_data:

