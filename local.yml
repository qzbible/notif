version: "3.8"

services:

  api: #container_name: api
    build:
      context: .
      dockerfile: ./docker/local/django/Dockerfile
    command: /start
    # restart: always
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    expose:
      - "9081"
    networks:
      - klivar-api-local-live-nw
    env_file:
      - ./.envs/.local/.postgres
      - ./.envs/.local/.django


  nginx:
    restart: always
    depends_on:
      - api
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    build:
      context: ./docker/local/nginx
      dockerfile: Dockerfile
    ports:
      - "8083:80"
    networks:
      - klivar-api-local-live-nw

networks:
  klivar-api-local-live-nw:
    external: true

volumes:
  static_volume:
  media_volume:
 
