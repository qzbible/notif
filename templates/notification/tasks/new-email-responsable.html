<!-- Content -->
<tr>
	<td class="content" style="background-color: #ffffff; padding: 24px;">
		<h1 style="font-size: 24px; font-weight: 600; text-align: center; margin-bottom: 24px; color: #4C0C84;">Détail de l'action</h1>
		
		<div class="greeting" style="font-size: 16px; margin-bottom: 16px; color: rgba(0, 0, 0, 0.85); font-weight: 400;">
			Bonjour <strong>{{dest_name}}</strong>,
		</div>
		
		<div class="message" style="font-size: 14px; line-height: 1.5715; margin-bottom: 24px; font-weight: 400; color: rgba(0, 0, 0, 0.65);">
			<p>{{sender_name}} vous invite à réaliser cette tâche: <strong>{{task_title}}</strong></p>
		</div>
		
		<table class="task-card" border="0" cellpadding="0" cellspacing="0" width="100%" style="border: 1px solid #f0f0f0; border-radius: 2px; margin-bottom: 24px; background-color: #ffffff;">
			<tr>
				<td style="padding: 24px;">
					<div class="task-title" style="font-size: 16px; font-weight: 500; color: rgba(0, 0, 0, 0.85); margin: 0 0 16px 0; padding-bottom: 8px; border-bottom: 1px solid #f0f0f0;">
						Détail de la tâche
					</div>
					<div class="task-content description" style="font-size: 14px; line-height: 1.5715; color: rgba(0, 0, 0, 0.65);">
						{{description|safe}}
					</div>
				</td>
			</tr>
		</table>
		
		<table border="0" cellpadding="0" cellspacing="0" width="100%">
			<tr>
				<td>
					<a href="{{url}}" class="btn" style="display: inline-block; background-color: #4C0C84; color: #ffffff; font-size: 14px; font-weight: 400; text-align: center; padding: 8px 16px; border-radius: 10px; margin: 8px 0 16px; text-decoration: none; border: 1px solid transparent;">
						Commencer maintenant
					</a>
				</td>
			</tr>
		</table>
	</td>
</tr>
<!-- Le footer commence ici -->
