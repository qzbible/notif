<!DOCTYPE html>

<html lang="en" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:v="urn:schemas-microsoft-com:vml">

<head>
	<title></title>
	<meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
	<meta content="width=device-width, initial-scale=1.0" name="viewport" />
	<!--[if mso]><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch><o:AllowPNG/></o:OfficeDocumentSettings></xml><![endif]--><!--[if !mso]><!-->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
		rel="stylesheet"><!--<![endif]-->
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 0;
		}

		a[x-apple-data-detectors] {
			color: inherit !important;
			text-decoration: inherit !important;
		}

		#MessageViewBody a {
			color: inherit;
			text-decoration: none;
		}

		p {
			line-height: inherit
		}

		.desktop_hide,
		.desktop_hide table {
			mso-hide: all;
			display: none;
			max-height: 0px;
			overflow: hidden;
		}

		.image_block img+div {
			display: none;
		}

		sup,
		sub {
			font-size: 75%;
			line-height: 0;
		}

		@media (max-width:700px) {
			.social_block.desktop_hide .social-table {
				display: inline-block !important;
			}

			.mobile_hide {
				display: none;
			}

			.row-content {
				width: 100% !important;
			}

			.stack .column {
				width: 100%;
				display: block;
			}

			.mobile_hide {
				min-height: 0;
				max-height: 0;
				max-width: 0;
				overflow: hidden;
				font-size: 0px;
			}

			.desktop_hide,
			.desktop_hide table {
				display: table !important;
				max-height: none !important;
			}
		}
	</style>
	<!--[if mso ]><style>sup, sub { font-size: 100% !important; } sup { mso-text-raise:10% } sub { mso-text-raise:-10% }</style> <![endif]-->
</head>

<body class="body"
	style="background-color: #FDFDFD; margin: 0; padding: 0; -webkit-text-size-adjust: none; text-size-adjust: none;">
	<table border="0" cellpadding="0" cellspacing="0" class="nl-container" role="presentation"
		style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; background-color: #FDFDFD; border-radius: 10px;"
		width="100%">
		<tbody>
			<tr>
				<td>
					<table align="center" border="0" cellpadding="0" cellspacing="0" class="row row-1"
						role="presentation" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; " width="100%">
						<tbody>
							<tr>
								<td>
									<table align="center" border="0" cellpadding="0" cellspacing="0"
										class="row-content stack" role="presentation"
										style="mso-table-lspace: 0pt; mso-table-rspace: 0pt;  color: #000000; width: 680px; margin: 0 auto;"
										width="680">
										<tbody>
											<tr>
												<td class="column column-1"
													style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; font-weight: 400; text-align: left; padding-bottom: 10px; padding-left: 5px; padding-right: 5px; padding-top: 10px; vertical-align: top; border-radius: 0px; border-top: 0px; border-right: 0px; border-bottom: 0px; border-left: 0px;"
													width="100%">
													<div class="spacer_block block-1"
														style="height:10px;line-height:10px;font-size:1px;"> </div>
												</td>
											</tr>
										</tbody>
									</table>
								</td>
							</tr>
						</tbody>
					</table>
					<table align="center" border="0" cellpadding="0" cellspacing="0" class="row row-2"
						role="presentation" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt;" width="100%">
						<tbody>
							<tr>
								<td>
									<table align="center" border="0" cellpadding="0" cellspacing="0"
										class="row-content stack" role="presentation"
										style="border-radius: 10px; mso-table-lspace: 0pt; mso-table-rspace: 0pt; background-color: #ffffff; color: #000000; width: 680px; margin: 0 auto;"
										width="680">
										<tbody>
											<tr>
												<td class="column column-1"
													style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; font-weight: 400; text-align: left; vertical-align: top; border-top: 0px; border-right: 0px; border-bottom: 0px; border-left: 0px;"
													width="100%">
													<table border="0" cellpadding="0" cellspacing="0"
														class="image_block block-1" role="presentation"
														style="mso-table-lspace: 0pt; mso-table-rspace: 0pt;"
														width="100%">
														<tr>
															<td class="pad"
																style="padding-bottom:10px;padding-top:10px;width:100%;">
																<div align="center" class="alignment"
																	style="line-height:10px">
																	<div style="max-width: 199px;"><img
																			alt="Yourlogo Light" height="auto"
																			src="{{ back_url }}media/icons/97a07cae-f702-49b6-b6cf-d46929e90027.png"
																			style="display: block; height: auto; border: 0; width: 80%;"
																			title="Yourlogo Light" width="199" /></div>
																</div>
															</td>
														</tr>
													</table>
 
													<table border="0" cellpadding="0" cellspacing="0"
														class="paragraph_block block-4" role="presentation"
														style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; word-break: break-word;"
														width="100%">
														<tr>
															<td class="pad"
																style="padding-bottom:5px;padding-left:30px;padding-right:30px;padding-top:15px;">
																<div
																	style="color:#393d47;font-family:'Poppins', sans-serif;font-size:15px;line-height:150%;text-align:left;mso-line-height-alt:24px;">
																	<p style="margin: 0; word-break: break-word;"><span
																			style="word-break: break-word;">Cher {{name}},</span></p>
																	<p style="margin: 0; word-break: break-word;"> </p>
																	<p style="margin: 0; word-break: break-word;">
																		Votre évaluation a bien été prise en compte et sera traitée dans les plus brefs délais.
																		</p>
																	</div>
															</td>
														</tr>
													</table>
													<table cellpadding="0" cellspacing="0" class="table_block block-5"
														role="presentation"
														style="border-top-right-radius: 10px; border-top-left-radius: 10px; mso-table-lspace: 0pt; mso-table-rspace: 0pt;"
														width="100%">
														<tr>
															<td class="pad"
																style="border-top-right-radius: 10px; border-top-left-radius: 10px; padding-left:30px;padding-right:30px;padding-top:20px;">
																<table
																	style="border-radius: 10px;border: 1px solid #E0E0E0; mso-table-lspace: 0pt; mso-table-rspace: 0pt; width: 100%; table-layout: fixed; font-family: 'Poppins', sans-serif; font-weight: 400; color: #101112; text-align: left; letter-spacing: 0px;"
																	width="100%">
																	<thead
																		style="border-top-right-radius: 10px; border-top-left-radius: 10px; vertical-align: top;  color: #4C0C84;  font-size: 17px; line-height: 120%;">

																		<th style="display: flex; border-top-right-radius: 10px; border-bottom: 1px solid #E0E0E0; border-top-left-radius: 10px; margin: 5px 10px; padding-top: 10px; padding-bottom: 5px; word-break: break-word; font-weight: 600; text-align: left;"
																			width="95%">Détail de l’action : </th>
																	</thead>
																	
																	<tbody
																		style="vertical-align: top; line-height: 120%;">
																		<tr>
																			<td style="padding-left:10px;padding-right:10px;padding-top:10px; word-break: break-word;font-weight: 500; font-size: 14px;"
																				width=" 100%">
																			 <b>{{type_task}} :</b>	{{title}}
																			</td>
																		</tr>
																		<tr>
																			<td style="padding-left: 10px; padding-right: 10px; padding-top: 2px; padding-bottom: 10px; word-break: break-word; font-size: 12px; font-weight: 400; border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; "
																				width="100%"> 
																				{{description|safe}} 
																			</td>
																		</tr>
																	</tbody>
																</table>
															</td>
														</tr>
													</table>
												
													<table cellpadding="0" cellspacing="0"
														class="paragraph_block block-6" role="presentation"
														style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; word-break: break-word; border-radius: 10px;"
														width="100%">
														<tr>
															<td class="pad"
																style="padding-bottom:30px;padding-left:30px;padding-right:30px;padding-top:20px; border-radius: 100px;">
																<div
																	style="color:#000000;font-family:'Poppins', sans-serif;font-size:15px;font-weight:400;line-height:150%;text-align:left;mso-line-height-alt:24px;">
																	<p style="margin: 0; word-break: break-word;">Merci
																		d’avance,<br />Votre équipe {{company}}</p>
																</div>
															</td>
														</tr>
													</table>
													
													
												</td>
											</tr>
										</tbody>
									</table>
								</td>
							</tr>
						</tbody>
					</table>
					
				</td>
			</tr>
		</tbody>
	</table><!-- End -->
</body>

</html>
