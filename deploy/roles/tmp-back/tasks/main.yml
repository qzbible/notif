---
- name: Create Firebase secrets directory (outside repo)
  file:
    path: /apps/firebase-secrets
    state: directory
    mode: '0700'  # Permissions restrictives
    owner: ubuntu
    group: ubuntu
  become: yes

- name: Create Firebase service account file with proper escaping
  copy:
    content: |
      {
        "type": {{ firebase_type | to_json }},
        "project_id": {{ firebase_project_id | to_json }},
        "private_key_id": {{ firebase_private_key_id | to_json }},
        "private_key": {{ firebase_private_key | to_json }},
        "client_email": {{ firebase_client_email | to_json }},
        "client_id": {{ firebase_client_id | to_json }},
        "auth_uri": {{ firebase_auth_uri | to_json }},
        "token_uri": {{ firebase_token_uri | to_json }},
        "auth_provider_x509_cert_url": {{ firebase_auth_provider_x509_cert_url | to_json }},
        "client_x509_cert_url": {{ firebase_client_x509_cert_url | to_json }},
        "universe_domain": {{ firebase_universe_domain | to_json }}
      }
    dest: /apps/firebase-secrets/evangelists-febb9-firebase-adminsdk-fbsvc-1aef63e5e5.json
    mode: '0600'
  become: yes

- name: Create nginx configuration
  community.docker.docker_config:
    name: "{{ nginx_config_name }}"
    state: present
    data: "{{ lookup('ansible.builtin.template', 'nginx.conf') }}"

- name: Make sure the destination_folder exists
  ansible.builtin.file:
    path: "{{ final_dest_folder }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0764"

- name: Copy the docker stack file
  ansible.builtin.template:
    src: "stack.yml"
    dest: "{{ final_dest_folder }}/stack.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0764"
  register: stack_file

- name: Copy the env files
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ final_dest_folder }}/.{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
  loop:
    - django.env
    - postgres.env
  register: env_files

# This is a hack to use docker-compose to replace the env vars since swarm cannot do that
- name: Generate the final stack file
  ansible.builtin.command:
    cmd: docker compose -f stack.yml config -o final-stack.yml
    chdir: "{{ final_dest_folder }}"
  changed_when: stack_file.changed

- name: Make sure the final is compatible with docker swarm
  ansible.builtin.command:
    cmd: yq --inplace 'del(.name)' final-stack.yml # Remove the top level name as swarm doesn't support it
    chdir: "{{ final_dest_folder }}"
  changed_when: stack_file.changed

# Fix mode values in the final stack file before deployment
- name: Fix mode values in configs
  ansible.builtin.shell: |
    # Check if file exists
    if [ -f "{{ final_dest_folder }}/final-stack.yml" ]; then
      # Fix mode with double quotes
      sed -i 's/mode: "0440"/mode: 288/g' "{{ final_dest_folder }}/final-stack.yml"
      # Fix mode with single quotes
      sed -i "s/mode: '0440'/mode: 288/g" "{{ final_dest_folder }}/final-stack.yml"
      # Fix mode without quotes
      sed -i 's/mode: 0440/mode: 288/g' "{{ final_dest_folder }}/final-stack.yml"
      
      # More generic replacements for other potential octal values
      sed -i 's/mode: "0[0-7][0-7][0-7]"/mode: 288/g' "{{ final_dest_folder }}/final-stack.yml"
      sed -i "s/mode: '0[0-7][0-7][0-7]'/mode: 288/g" "{{ final_dest_folder }}/final-stack.yml"
      sed -i 's/mode: 0[0-7][0-7][0-7]/mode: 288/g' "{{ final_dest_folder }}/final-stack.yml"
      
      echo "Mode values fixed in {{ final_dest_folder }}/final-stack.yml"
    else
      echo "File {{ final_dest_folder }}/final-stack.yml not found"
    fi
  args:
    executable: /bin/bash
  register: fix_result
  changed_when: "'Mode values fixed' in fix_result.stdout"

# Debug to show the changes made
- name: Show configs section after fix
  ansible.builtin.shell: |
    if [ -f "{{ final_dest_folder }}/final-stack.yml" ] && grep -q "configs:" "{{ final_dest_folder }}/final-stack.yml"; then
      grep -A 5 "configs:" "{{ final_dest_folder }}/final-stack.yml"
    else
      echo "No configs section found"
    fi
  args:
    executable: /bin/bash
  register: configs_section
  changed_when: false

- name: Display configs section
  ansible.builtin.debug:
    var: configs_section.stdout_lines

- name: Deploy the stack
  community.docker.docker_stack:
    name: "{{ tmp_back_stack_name }}"
    compose:
      - "{{ final_dest_folder }}/final-stack.yml"
    prune: true
    state: present
    resolve_image: always
    with_registry_auth: true
  register: stack_deploy

- name: Wait for the deployment to finish
  ansible.builtin.command:
    cmd: docker-stack-wait -t 20 {{ tmp_back_stack_name }}
    chdir: "{{ final_dest_folder }}"
  register: wait_for_deploy
  ignore_errors: true
  changed_when: false
  retries: 7
  delay: 2

- name: Deployment output
  ansible.builtin.debug:
    msg: "{{ wait_for_deploy.stdout_lines + wait_for_deploy.stderr_lines }}"

- name: Fail if "the wait for deployment to finish" fails
  ansible.builtin.fail:
    msg: "The deployment has failed. See the previous logs"
  when: wait_for_deploy.rc != 0

